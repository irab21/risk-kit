[theme]
base = "light"
primaryColor = "#1b3270"
backgroundColor = "#f6f4ef"
secondaryBackgroundColor = "#f1ede5"
textColor = "#0f172a"
linkColor = "#1b3270"
borderColor = "#e7e2d8"
baseRadius = "10px"
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f4ef"

[server]
headless = true

[browser]
gatherUsageStats = false
